[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "egresspin"
version = "0.1.0"
description = "Bounded HTTP URL imports pinned to validated addresses with per-hop evidence"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lllleolin-max"}]
dependencies = []

[project.scripts]
egresspin = "egresspin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
